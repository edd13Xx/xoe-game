[workspace]
resolver = "3"
members = ["contracts/xoe-token", "contracts/xoe-rewards", "contracts/wnear-mock", "integration-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://example.invalid/xoe-rewards-local-prototype"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
